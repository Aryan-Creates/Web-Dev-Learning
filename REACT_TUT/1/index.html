<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        color: rgb(255, 0, 0);
        height: 112px;
        width: 244px;
        border: 4px solid black;
        padding: 4px;
      }
    </style>
  </head>
  <body>
    <script>
      let box1 = "Hey";
      let box2 = "Heyy";
      let box3 = "Heyyy";
    </script>
    <div class="box box1">This is box 1</div>
    <div class="box box2">This is box 2</div>
    <div class="box box3">This is box 3</div>
    <script>
      setTimeout(() => {
        document.querySelector(".box1").innerHTML = "Hey";
      }, 1000);
      setTimeout(() => {
        document.querySelector(".box2").innerHTML = "I'm";
      }, 2000);
      setTimeout(() => {
        document.querySelector(".box3").innerHTML = "Back";
      }, 3000);
    </script>
  </body>
</html>
